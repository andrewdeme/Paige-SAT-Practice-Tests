name: Bug
description: Something is broken or behaves wrongly
labels: ["type: bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Start screen
        - Module (question view / timer / pacing rail)
        - Done screen
        - Resume
        - Coach view
        - Other / not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Device and browser
      placeholder: e.g. iPad, Safari 18
