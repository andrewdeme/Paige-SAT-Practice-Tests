name: Sync labels

# Makes the repo's labels match every .github/labels*.json file (creates missing
# ones, updates color and description on existing ones, never deletes).
#   labels.json          the kit's labels (refreshed by install.sh --update)
#   labels.project.json  this project's own labels, e.g. "area: ..." (yours)
# Runs when one of them changes on `dev` or the default branch, or by hand from
# the Actions tab.

on:
  push:
    paths: [".github/labels*.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: >-
      github.ref_name == 'dev' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for file in .github/labels*.json; do
            echo "== $file"
            jq -c '.[]' "$file" | while read -r label; do
              gh label create "$(jq -r .name <<<"$label")" \
                --color "$(jq -r .color <<<"$label")" \
                --description "$(jq -r .description <<<"$label")" \
                --force
            done
          done
